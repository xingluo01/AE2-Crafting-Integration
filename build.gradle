plugins {
    id 'java-library'
    id 'idea'
    // Minecraft/NeoForge 开发插件与版本基线统一放在 gradle/libs.versions.toml。
    alias libs.plugins.modDevGradle
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }

    // client 独立源集：通用/服务端代码不会误依赖客户端类。
    client {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    clientRuntimeClasspath.extendsFrom clientLocalRuntime
    testRuntimeClasspath.extendsFrom testLocalRuntime

    // 运行期 AE2 走 CurseForge 构件，编译期走 maven 件；钉到同一版本，避免 FML 按版本号
    // 挑出两份 ae2 声明。两个坐标要一起动。
    configureEach {
        resolutionStrategy.force "${libs.ae2.get()}"
    }
}

neoForge {
    version = libs.versions.neoForge.get()

    parchment {
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.client)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
            sourceSet(sourceSets.test)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
            sourceSet = sourceSets.client
            ideName = 'Client'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            ideName = 'Server'
            programArguments.addAll '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.test
            ideName = 'Game Tests'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            sourceSet = sourceSets.main
            ideName = 'Data Generation'
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }
}

// 默认 java 组件只含 main，把 client 源集并进发行 jar。
tasks.named('jar', Jar) {
    dependsOn sourceSets.client.classesTaskName
    from sourceSets.client.output
    // LGPL-3.0 要求许可证随发行件一起分发。
    from('LICENSE') { into 'META-INF' }
}

tasks.matching { it.name == 'remapJar' }.configureEach {
    dependsOn sourceSets.client.classesTaskName
}

// 处理资源前由模板生成 neoforge.mods.toml。
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range : minecraft_version_range,
        neo_version_range       : neo_version_range,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.named('processResources', ProcessResources) {
    dependsOn generateModMetadata
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    compileOnly(libs.jetbrains.annotations)

    // AE2 / GuideME 由整合包提供，只在编译期需要。
    compileOnly(libs.ae2)
    clientCompileOnly(libs.ae2)
    compileOnly(libs.guideme)
    clientCompileOnly(libs.guideme)

    // 开发运行期：AE2 1.21.1 线 19.2.19（与 libs.versions.toml 对齐）及其 GuideME 前置。
    localRuntime 'curse.maven:applied-energistics-2-223794:9519988'
    localRuntime 'maven.modrinth:guideme:21.1.15'

    // [环境 mod 第 1 轮] 无线终端基座：AE2WTLib 运行期 + main/client 编译期 API。
    // 后续无线终端接 AE2WTLib 时沿用这里的版本，改版本要这几行一起动。
    localRuntime 'de.mari_023:ae2wtlib:19.5.1'
    localRuntime 'de.mari_023:ae2wtlib_api:19.5.1'
    compileOnly 'de.mari_023:ae2wtlib_api:19.5.1'
    clientCompileOnly 'de.mari_023:ae2wtlib_api:19.5.1'

    // [环境 mod 第 1 轮] 配方查看器默认 JEI 口径；AE2 的 JEI 集成是独立模组，元数据把 jei 标为必需。
    localRuntime(libs.jei.runtime)
    localRuntime 'curse.maven:ae2-jei-integration-1074338:7727898'

    // [环境 mod 第 1 轮] 客户端辅助：机器状态、UI、拼音搜索、渲染优化。
    localRuntime 'maven.modrinth:modern-ui:3.13.0.1'
    localRuntime 'maven.modrinth:jade:15.10.6+neoforge'
    localRuntime 'maven.modrinth:justenoughcharacters:iNnJuUnx'
    localRuntime 'maven.modrinth:embeddium:1.0.15+mc1.21.1'
    // Jade provider 的编译期 API，后续写集成时不用再补坐标。
    compileOnly 'maven.modrinth:jade:15.10.6+neoforge'

    // [环境 mod 第 1 轮·追加] FTB Library + FTB Ultimine（连锁挖掘）。
    // FTB 系只在 CurseForge / FTB 官方 maven 发布，Modrinth 上没有；这里用 -neoforge 专用构件。
    // 版本按 ftb-ultimine-neoforge 2101.1.13 的 POM 依赖表锁定，缺任一条 FML 预加载会拦下。
    localRuntime 'dev.architectury:architectury-neoforge:13.0.6'
    localRuntime 'dev.ftb.mods:ftb-library-neoforge:2101.1.28'
    localRuntime 'dev.ftb.mods:ftb-ranks-neoforge:2101.1.2'
    localRuntime 'dev.ftb.mods:ftb-ez-crystals:21.1.1'
    localRuntime 'dev.ftb.mods:ftb-ultimine-neoforge:2101.1.13'

    // [环境 mod 第 2 轮] ExtendedAE + AdvancedAE：GUI/功能对齐的参照实现。
    localRuntime 'curse.maven:ex-pattern-provider-892005:8511901'
    localRuntime 'curse.maven:advancedae-1084104:7849217'
    // AAE 必需前置 GeckoLib；EAE / AAE 共用 Glodium UI 库。
    localRuntime 'io.github.glodblock:Glodium:1.21-2.2-neoforge'
    localRuntime 'maven.modrinth:geckolib:gFmrC8Ru'

    // [环境 mod 第 2 轮] ExtendedAE Plus：样板上传接口，后续编码终端对接的参照。
    localRuntime 'curse.maven:extendedae-plus-1337639:8998231'
    compileOnly 'curse.maven:extendedae-plus-1337639:8998231'
    clientCompileOnly 'curse.maven:extendedae-plus-1337639:8998231'
    // EAE+ 自身集成的运行期前置。
    localRuntime 'curse.maven:curios-309927:6529130'
    localRuntime 'curse.maven:kotlin-for-forge-351264:7471280'

    // [环境 mod 第 2 轮] Applied Flux + Polymorph：升级槽与多配方切换。
    localRuntime 'curse.maven:applied-flux-965012:9288549'
    localRuntime 'maven.modrinth:polymorph:9yWvrF5o'
    clientLocalRuntime 'maven.modrinth:polymorph:9yWvrF5o'
    compileOnly 'maven.modrinth:polymorph:9yWvrF5o'
    clientCompileOnly 'maven.modrinth:polymorph:9yWvrF5o'

    // [环境 mod 第 2 轮] 存储扩展：大容量 / 混合元件测试环境。
    localRuntime 'maven.modrinth:jjuIRIVr:RPG4EriK'          // MEGA Cells 4.11.0
    localRuntime 'maven.modrinth:ae2-omni-cells:k444ySGT'

    // [环境 mod 第 3 轮] 闪电科技族：把自动合成路由到别的特殊合成系统。
    // 三条坐标各自同时进 main / client 编译期与运行期，改版本要一起动。
    compileOnly 'maven.modrinth:ae2-lightning-tech:2.1.2'
    clientCompileOnly 'maven.modrinth:ae2-lightning-tech:2.1.2'
    localRuntime 'maven.modrinth:ae2-lightning-tech:2.1.2'
    compileOnly 'maven.modrinth:thunderbolt-core:2.0.3'
    clientCompileOnly 'maven.modrinth:thunderbolt-core:2.0.3'
    localRuntime 'maven.modrinth:thunderbolt-core:2.0.3'
    compileOnly 'maven.modrinth:ae2lt-packaged-pattern-provider:1.2.2'
    clientCompileOnly 'maven.modrinth:ae2lt-packaged-pattern-provider:1.2.2'
    localRuntime 'maven.modrinth:ae2lt-packaged-pattern-provider:1.2.2'

    // [环境 mod 第 3 轮] NEO ECO 族：大订单吞吐。ECO / 青春版 / LDLib2 / Bigger AE2
    // 的地板互相咬合，升任一版本前先按各自 jar 里的 mods.toml 复核一遍。
    compileOnly 'curse.maven:neo-eco-ae-extension-1460639:9349859'
    clientCompileOnly 'curse.maven:neo-eco-ae-extension-1460639:9349859'
    localRuntime 'curse.maven:neo-eco-ae-extension-1460639:9349859'
    localRuntime 'curse.maven:neo-eco-prototype-1695260:9350441'
    localRuntime 'maven.modrinth:ldlib:A8dTTrXo'
    localRuntime 'maven.modrinth:tHmKhHkk:RjWjkDsE'          // Bigger AE2 21.2.3
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath + configurations.testRuntimeClasspath
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 仓库默认只留最小依赖；后续接入工作台/模组集成时，把对应 API 加进对应源集。
repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    // JEI 官方 maven：libs.versions.toml 里的 jei-runtime 从这里取。
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    // FTB 官方 maven：FTB Lib / Ultimine / Ranks 的 -neoforge 专用构件。
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
    }
    // Architectury API：FTB 系的必需前置（mods.toml 声明 [13.0.6,)）。
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://cursemaven.com' }
        }
        filter { includeGroup 'curse.maven' }
    }
}
